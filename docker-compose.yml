services:
  may:
    # image: ghcr.io/dannymcc/may:latest
    # To build locally instead, comment out 'image' above and uncomment:
    build: .
    container_name: may
    restart: unless-stopped
    ports:
      - "5050:5050"
    volumes:
      - may_data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/may.db}
      # PostgreSQL: postgresql+psycopg://may:may@postgres:5432/may
      # MySQL:      mysql+pymysql://may:may@mysql:3306/may
      # MariaDB:    mysql+pymysql://may:may@mariadb:3306/may
      - UPLOAD_FOLDER=/app/data/uploads
      # Optional: run the container as a specific host user/group so bind-mounted
      # data is owned correctly (linuxserver.io convention; default 1000:1000).
      # On Unraid, set these to 99 and 100.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Optional: set a fixed admin password. Leave unset and a secure random
      # password is generated on first run and printed to the container logs;
      # you are then forced to change it on first login.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # SMTP defaults point at the bundled mailpit service; values saved in the
      # admin UI (Settings -> Notifications) override these env fallbacks.
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_SENDER=${SMTP_SENDER:-may@localhost}
      - SMTP_SENDER_NAME=${SMTP_SENDER_NAME:-May}
      - SMTP_TLS=${SMTP_TLS:-false}
      - SMTP_SSL=${SMTP_SSL:-false}
    depends_on:
      - mailpit

  # Local SMTP server + web inbox for testing notification emails.
  # Web UI: http://localhost:8025 - SMTP (port 1025) stays inside the compose network.
  mailpit:
    image: axllent/mailpit
    container_name: may-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    environment:
      - MP_DATABASE=/data/mailpit.db
      # Accept any SMTP credentials so the admin UI works with or without
      # username/password filled in (mailpit is a catch-all test inbox).
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    volumes:
      - may_mailpit_data:/data

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-may}
      - POSTGRES_USER=${POSTGRES_USER:-may}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-may}
    volumes:
      - may_postgres_data:/var/lib/postgresql/data

  mysql:
    image: mysql:8
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-may}
      - MYSQL_USER=${MYSQL_USER:-may}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-may}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-may-root}
    volumes:
      - may_mysql_data:/var/lib/mysql

  mariadb:
    image: mariadb:11
    profiles: ["mariadb"]
    restart: unless-stopped
    environment:
      - MARIADB_DATABASE=${MARIADB_DATABASE:-may}
      - MARIADB_USER=${MARIADB_USER:-may}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD:-may}
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-may-root}
    volumes:
      - may_mariadb_data:/var/lib/mysql

volumes:
  may_data:
  may_mailpit_data:
  may_postgres_data:
  may_mysql_data:
  may_mariadb_data:
